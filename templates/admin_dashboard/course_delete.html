{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Delete Course</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>

    <h1>Delete Course</h1>

    <p>
        Are you sure you want to delete
        <strong>{{ course.title }}</strong>?
    </p>

    <form method="POST">
        {% csrf_token %}

        <button type="submit">
            Yes, Delete Course
        </button>
    </form>

    <br>

    <a href="{% url 'course-list' %}">
        Cancel
    </a>

</body>
</html>
