{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Edit Course</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>

    <h1>Edit Course</h1>

    <form method="POST">
        {% csrf_token %}

        <p>
            <label>Course Title:</label>
            <input
                type="text"
                name="title"
                value="{{ course.title }}"
                required
            >
        </p>

        <p>
            <label>Description:</label>
            <textarea name="description" required>{{ course.description }}</textarea>
        </p>

        <p>
            <label>Duration:</label>
            <input
                type="text"
                name="duration"
                value="{{ course.duration }}"
                required
            >
        </p>

        <p>
            <label>Teacher:</label>
            <select name="teacher" required>
                {% for teacher in teachers %}
                    <option
                        value="{{ teacher.id }}"
                        {% if teacher.id == course.assigned_teacher.id %}
                            selected
                        {% endif %}
                    >
                        {{ teacher.username }}
                    </option>
                {% endfor %}
            </select>
        </p>

        <button type="submit">
            Update Course
        </button>
    </form>

    <br>

    <a href="{% url 'course-list' %}">
        Cancel
    </a>

</body>
</html>
