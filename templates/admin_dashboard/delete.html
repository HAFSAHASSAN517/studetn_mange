{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Delete Student</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>

<body>

    <h1>Delete Student</h1>

    <p>
        Are you sure you want to delete
        <strong>{{ student.name }}</strong>?
    </p>

    <form method="POST">
        {% csrf_token %}

        <button type="submit">
            Yes, Delete Student
        </button>
    </form>

    <br>

    <a href="{% url 'student-detail' student.id %}">
        Cancel
    </a>
    

</body>
</html>
