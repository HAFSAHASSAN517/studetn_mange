{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Edit Enrollment</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>

<body>

    <h1>Edit Enrollment</h1>

    <form method="POST">
        {% csrf_token %}

        <label>Student:</label>

        <select name="student">
    {% for student in students %}
        <option value="{{ student.id }}"
            {% if student.id == enrollment.student.id %}selected{% endif %}>
            {{ student.name }}
        </option>
    {% endfor %}
</select>

        <br><br>

        <label>Course:</label>

        <select name="course">
    {% for course in courses %}
        <option value="{{ course.id }}"
            {% if course.id == enrollment.course.id %}selected{% endif %}>
            {{ course.title }}
        </option>
    {% endfor %}
</select>

        <br><br>

        <button type="submit">
            Update Enrollment
        </button>

    </form>

    <br>

    <a href="{% url 'enrollment-list' %}">
        Cancel
    </a>

</body>
</html>
