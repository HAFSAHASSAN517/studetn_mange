{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Edit Student</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>

<body>

    <h1>Edit Student</h1>

    <form method="POST">
        {% csrf_token %}

        <p>
            <label>Name:</label>
            <input
                type="text"
                name="name"
                value="{{ student.name }}"
                required
            >
        </p>

        <p>
            <label>Email:</label>
            <input
                type="email"
                name="email"
                value="{{ student.user.email }}"
                required
            >
        </p>

        <p>
            <label>Age:</label>
            <input
                type="number"
                name="age"
                value="{{ student.age }}"
                min="1"
                required
            >
        </p>

        <button type="submit">Update Student</button>
    </form>

    <br>

    <a href="{% url 'student-detail' student.id %}">
        Cancel
    </a>

</body>
</html>
